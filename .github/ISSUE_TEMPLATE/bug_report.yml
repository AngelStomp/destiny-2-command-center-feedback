name: Bug report
description: Something on the site is broken or wrong.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never include passwords, tokens, cookies or Bungie sign-in details**; we will never ask for them.
  - type: input
    id: page
    attributes:
      label: Page
      description: The page's address or name, for example "Armory → Postmaster".
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Computer
        - Phone
        - Tablet
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      description: For example Chrome, Safari, Firefox or Edge.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead. A screenshot helps (make sure it shows nothing private).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it again
      description: If you know them.
      placeholder: |
        1. Open …
        2. Click …
        3. See …
  - type: checkboxes
    id: safe
    attributes:
      label: Privacy
      options:
        - label: My report contains no passwords, tokens, cookies or sign-in details.
          required: true
